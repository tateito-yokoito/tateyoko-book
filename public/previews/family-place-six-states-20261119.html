<!doctype html>
<html lang="ja">
<head>

  <title>縦糸∞横糸｜家族ホーム・人物ページの状態別レビュー</title>
  <style>
    :root{--ivory:#fbf8ef;--paper:#fffdf8;--green:#527b20;--deep:#2f542c;--olive:#71953a;--ink:#22251d;--sub:#687064;--line:#e8e5d8;--shadow:0 4px 12px #443a2018}
    *{box-sizing:border-box}body{margin:0;background:#eeeae0;color:#253024;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button{font:inherit;cursor:pointer}
    .pagehead{max-width:1376px;margin:auto;padding:25px 18px 9px}.pagehead h1{margin:0 0 6px;font-size:24px}.pagehead p{margin:0;color:#566052;font-size:13px;line-height:1.6}.switch{display:flex;gap:8px;margin-top:15px}.switch a{background:#fffcf5;color:var(--deep);border:1px solid #cad5bf;border-radius:99px;padding:8px 16px;text-decoration:none;font-size:13px;font-weight:700}.switch a.active{background:var(--deep);color:white}
    .grid{display:grid;grid-template-columns:repeat(4,320px);gap:17px;justify-content:center;padding:15px 10px 20px}.panelhead{height:52px}.panelhead strong{display:block;font-size:15px}.panelhead small{font-size:11px;color:#687164}.phone{width:320px;height:636px;overflow:hidden;border-radius:24px;box-shadow:0 16px 30px #4b55352c;background:var(--ivory);position:relative}.approved img{position:absolute;top:-6px;width:1620px;height:auto;max-width:none}.approved.home img{left:-8px}.approved.person img{left:-344px}.approved:after{content:"";position:absolute;bottom:0;left:0;right:0;height:100px;background:var(--ivory)}.desc{font-size:11px;line-height:1.5;color:#5a6556;margin:9px 0 0;min-height:40px}
    .mock{height:100%;background:linear-gradient(#fffcf5,#fbf8ef);color:var(--ink);font-size:11px}.status{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 15px;font-size:10px;font-weight:750}.bar{height:45px;background:#fffcf6;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:8px}.brand{display:flex;align-items:center;gap:6px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:19px;font-weight:800;white-space:nowrap}.bar-title{font-weight:800;font-size:14px}.bar-side{display:flex;align-items:center;gap:8px}.ico{display:inline-flex;width:19px;height:19px;align-items:center;justify-content:center;color:var(--green);flex:none}.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.bar-side .ico{width:18px;height:18px}
    .hero{height:127px;position:relative;overflow:hidden;border-radius:16px 16px 0 0;margin:0 8px;background:url('family-power-assets/landscape-review.jpg') center 57%/cover}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(#fff8e8c7 0%,#fff8e833 58%,transparent 82%)}.hero h2{position:relative;margin:10px 0 0;text-align:center;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:21px;line-height:1.35;color:#1d241a;text-shadow:0 1px 3px #fff}
    .homebody{padding:9px 13px 44px}.linehead{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:7px}.linehead b{font-size:14px}.linehead span{font-size:10px}.card{border:1px solid var(--line);border-radius:12px;background:var(--paper);box-shadow:var(--shadow)}.empty-book{height:132px;display:flex;align-items:center;gap:11px;padding:13px}.book-shape{width:63px;height:89px;border-radius:3px 6px 6px 3px;border-left:6px solid #afbd90;background:linear-gradient(125deg,#f9f1dc,#e7edd8);box-shadow:3px 4px 6px #4d563328;flex:none;display:flex;align-items:center;justify-content:center;color:#668244}.empty-book strong{display:block;font-size:13px;line-height:1.5}.empty-book p{font-size:10px;color:var(--sub);line-height:1.55;margin:5px 0 0}.primary{width:100%;height:34px;margin-top:9px;border:0;border-radius:99px;background:linear-gradient(#77a432,#4c781a);box-shadow:0 3px 6px #557b292e;color:white;font-size:12px;font-weight:800}.subtle{margin:9px 0 0;font-size:10px;color:#64705e;line-height:1.5}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.quick>div{height:52px;border:1px solid #e8e8d9;background:#fffefa;border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700}.quick .ico{width:17px;height:17px}.little-title{margin:12px 0 5px;font-size:12px}.mini-card{padding:9px 10px;min-height:45px;font-size:11px}.mini-card strong{display:block}.mini-card span{display:block;color:var(--sub);font-size:10px;margin-top:3px}.coverrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.coveritem{min-width:0;text-align:center}.cover{height:101px;position:relative;background-image:url('family-power-assets/covers-review.jpg');background-size:300% 100%;background-position:left center;border-left:5px solid #a2bba1;border-radius:3px 6px 6px 3px;box-shadow:2px 4px 7px #473e2c42;overflow:hidden}.cover.mid{background-position:center center;border-color:#d6b4a9}.cover.last{background-position:right center;border-color:#a79678}.cover:before{content:"";position:absolute;inset:0 0 40%;background:linear-gradient(#fff8,#fff0)}.cover b{position:relative;display:block;padding-top:8px;font-family:"Yu Mincho",serif;font-size:11px;line-height:1.2;text-shadow:0 1px 3px white}.pill{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:99px;background:#e9efdb;color:#4d742f;font-size:9px;font-weight:700}.pill.done{background:#5d862a;color:#fff}.memory-card{display:flex;gap:8px;align-items:center;padding:7px}.memory-thumb{width:50px;height:42px;border-radius:6px;background:url('family-power-assets/landscape-review.jpg') center/cover}.memory-card b{display:block;font-size:11px}.memory-card small{display:block;color:var(--sub);margin-top:3px}.bottom{position:absolute;bottom:0;left:0;right:0;height:43px;background:#fffcf5;border-top:1px solid #e8e5d7;display:grid;grid-template-columns:repeat(4,1fr)}.bottom div{display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:9px;font-weight:700}.bottom .ico{width:15px;height:15px}.bottom .active{color:var(--green)}
    .person-head{padding:2px 14px 9px;display:flex;align-items:center;gap:11px}.avatar{width:73px;height:73px;object-fit:cover;border-radius:50%;box-shadow:0 2px 7px #5b4d352d}.person-head h2{font-size:16px;margin:0 0 3px}.person-head p{font-size:10px;line-height:1.4;margin:2px 0;color:#4c574b}.profile-btn{display:block;margin:0 auto 8px;width:172px;height:26px;border-radius:99px;background:#f5f7e9;border:1px solid #dfe8cc;color:#41691f;font-weight:700;font-size:10px}.tabs{height:35px;display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #ece9df}.tabs div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.tabs .active{color:var(--green);border-bottom:3px solid #83a532}.personbody{padding:9px 13px}.empty-story{padding:14px 12px;text-align:center}.empty-story .book-shape{margin:auto;height:68px;width:49px}.empty-story strong{display:block;margin-top:9px;font-size:13px}.empty-story p{font-size:10px;line-height:1.5;color:var(--sub);margin:5px 0 0}.outline{width:100%;height:31px;border-radius:99px;border:1px solid #9fb673;color:#426b1e;background:#fffdf2;font-weight:700;font-size:11px;margin-top:8px}.topic-heading{font-size:13px;font-weight:800;margin:11px 0 5px}.story-row{display:flex;align-items:center;gap:8px;padding:8px 9px;margin-bottom:6px;min-height:52px}.story-row .ico{width:17px;height:17px}.story-row b{font-size:11px;line-height:1.35}.story-row small{display:block;color:#6d7767;font-size:9px;margin-top:3px}.story-row .arrow{margin-left:auto;font-size:18px;color:#789249}.book-card{padding:7px;display:flex;gap:8px;min-height:103px}.book-card .cover{width:71px;height:89px;flex:none}.book-card strong{display:block;font-size:11px;margin:3px 0 5px}.book-card small{display:block;color:#667063;font-size:10px}.read{border:0;border-radius:99px;background:#5d8726;color:white;font-weight:700;font-size:10px;padding:6px 17px;margin:8px 0 0 39px}.topic{height:28px;display:flex;align-items:center;gap:7px;border-bottom:1px solid #e8e6da;padding:0 6px;background:#fffdfa;font-size:11px;font-weight:700}.topic .ico{width:17px;height:17px}.topic small{margin-left:auto}.person-note{margin-top:9px;padding:8px 9px;color:#586551;font-size:10px;line-height:1.5}
    .foot{max-width:1376px;margin:0 auto 25px;padding:0 18px;color:#5e6959;font-size:12px;line-height:1.6}@media(max-width:1390px){.grid{grid-template-columns:repeat(2,320px)}}@media(max-width:700px){.grid{grid-template-columns:320px}.pagehead{max-width:360px}.foot{max-width:360px}}
  </style>
</head>
<body>
  <header class="pagehead"><h1>家族のチカラ｜状態別デザインレビュー</h1><p>承認済みVer1.0を視覚の正本とし、実データがまだない状態も同じ世界観で表現した静的モックです。画面内の操作は接続していません。</p><nav class="switch" aria-label="比較する画面"><a id="homeLink" href="?view=home">家族ホーム A・B・C</a><a id="personLink" href="?view=person">人物ページ A・B・C</a></nav></header>
  <main class="grid" id="grid"></main>
  <p class="foot">A・B・Cは状態を説明する架空のサンプルです。生成した風景・肖像・表紙はレビュー専用の仮素材で、実在の顧客・作品・思い出を表しません。承認済み画像は左端の比較参照にのみ使用しています。</p>
  <script>
    const icons={home:'<path d="m2 9 8-7 8 7v9H2z"/><path d="M7 18v-6h6v6"/>',book:'<path d="M2 3c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1zM10 4v14"/>',people:'<circle cx="6" cy="6" r="2"/><circle cx="14" cy="6" r="2"/><path d="M1 18v-3a5 5 0 0 1 10 0v3M10 18v-3a5 5 0 0 1 9 0v3"/>',tree:'<circle cx="10" cy="4" r="2"/><circle cx="4" cy="16" r="2"/><circle cx="16" cy="16" r="2"/><path d="M10 6v5M4 14v-3h12v3"/>',memory:'<rect x="2" y="3" width="16" height="14" rx="2"/><circle cx="7" cy="8" r="1"/><path d="m4 15 4-4 3 2 3-3 4 5"/>',bell:'<path d="M5 14V8a5 5 0 0 1 10 0v6l2 2H3zM8 18h4"/>',gear:'<circle cx="10" cy="10" r="3"/><path d="M10 1v2m0 14v2M1 10h2m14 0h2M3.6 3.6 5 5m10 10 1.4 1.4m0-12.8L15 5M5 15l-1.4 1.4"/>',brief:'<rect x="2" y="6" width="16" height="12" rx="2"/><path d="M7 6V3h6v3M2 11h16"/>'};
    const icon=n=>`<span class="ico" aria-hidden="true"><svg viewBox="0 0 20 20">${icons[n]}</svg></span>`;
    const status='<div class="status"><span>9:41</span><span>▮▮▮ ◕ ▰</span></div>';
    const homebar=`<div class="bar"><div class="brand">${icon('home')}縦糸∞横糸</div><div class="bar-side">${icon('bell')}${icon('gear')}</div></div>`;
    const hero='<div class="hero"><h2>家族のチカラは、<br>人生を照らす。</h2></div>';
    const quick=`<div class="quick"><div>${icon('tree')}家系図</div><div>${icon('book')}家族年表</div><div>${icon('memory')}家族の思い出</div></div>`;
    const bottom=`<div class="bottom"><div class="active">${icon('home')}ホーム</div><div>${icon('book')}人生の物語</div><div>${icon('people')}家族</div><div>${icon('memory')}思い出</div></div>`;
    const noBook='<div class="card empty-book"><div class="book-shape">✦</div><div><strong>家族の人生の物語は<br>これから</strong><p>語りや写真が集まったら、<br>ここに一冊ずつ並びます。</p></div></div>';
    const cover=(name,cls,status,done=false)=>`<div class="coveritem"><div class="cover ${cls}"><b>${name}</b></div><span class="pill ${done?'done':''}">${status}</span></div>`;
    const homeA=`${status}${homebar}${hero}<div class="homebody"><div class="linehead"><b>家族の人生の物語</b></div>${noBook}<button class="primary">＋ 家族を1人登録する</button><p class="subtle">まずは大切な人を登録して、家族の場所を育てましょう。</p>${quick}<h3 class="little-title">家族の人たち</h3><div class="card mini-card"><strong>まだ登録された人物はいません</strong><span>登録すると、ここからプロフィールを開けます。</span></div></div>${bottom}`;
    const homeB=`${status}${homebar}${hero}<div class="homebody"><div class="linehead"><b>家族の人生の物語</b></div>${noBook}<button class="primary">＋ 家族の思い出を残す</button>${quick}<h3 class="little-title">家族の人たち</h3><div class="card mini-card"><strong>山田 太郎さん　›</strong><span>プロフィールへ。人生の語りはこれから。</span></div></div>${bottom}`;
    const homeC=`${status}${homebar}${hero}<div class="homebody"><div class="linehead"><b>家族の人生の物語</b><span>すべて見る ›</span></div><div class="coverrow">${cover('お父さんの<br>人生','','完成',true)}${cover('お母さんの<br>人生','mid','制作中')}${cover('祖父の<br>人生','last','これから')}</div><button class="primary">＋ 人生の物語をつくる</button>${quick}<h3 class="little-title">家族の思い出</h3><div class="card memory-card"><div class="memory-thumb"></div><div><b>家族旅行の思い出</b><small>写真と語りが家族の場所に増えました</small></div></div></div>${bottom}`;
    const personbar=`<div class="bar"><span style="font-size:23px">‹</span><span class="bar-title">山田 太郎さん</span><span style="font-size:20px">···</span></div>`;
    const personhead=`<div class="person-head"><img class="avatar" src="family-power-assets/portrait-review.jpg" alt="架空人物の仮写真"><div><h2>山田 太郎</h2><p>（やまだ たろう）</p><p>プロフィールは後から少しずつ<br>追加できます。</p></div></div><button class="profile-btn">♙　プロフィールを見る　›</button>`;
    const personheadFull=`<div class="person-head"><img class="avatar" src="family-power-assets/portrait-review.jpg" alt="架空人物の仮写真"><div><h2>山田 太郎</h2><p>（やまだ たろう）<br>1935年4月10日生</p><p>家族を大切にし、挑戦を続けた<br>やさしく頼もしい父です。</p></div></div><button class="profile-btn">♙　プロフィールを見る　›</button>`;
    const tabs=`<div class="tabs"><div class="active">人生</div><div>思い出</div><div>年表</div></div>`;
    const story=(title,sub)=>`<div class="card story-row">${icon('book')}<div><b>${title}</b><small>${sub}</small></div><span class="arrow">›</span></div>`;
    const personA=`${status}${personbar}${personhead}${tabs}<div class="personbody"><div class="card empty-story"><div class="book-shape">✦</div><strong>人生の語りは、これから</strong><p>思い出したことから、声や文章で<br>少しずつ残せます。</p><button class="primary">＋ 最初の語りを残す</button></div><div class="card person-note">BOOKの完成作品はまだありません。記録が生まれたら、この「人生」タブに並びます。</div></div>`;
    const personB=`${status}${personbar}${personheadFull}${tabs}<div class="personbody"><div class="card person-note" style="margin:0 0 8px">人生の語りが2件あります。完成したBOOKはまだありません。</div><div class="topic-heading">残してきた語り</div>${story('子どもの頃、好きだった遊び','声の記録あり')}${story('家族と過ごした休日','文章・写真あり')}<button class="outline">＋ 新しい語りを追加する</button><div class="card person-note">BOOKをつくるときは、ここから既存の制作モードへ進みます。購入済みかどうかに応じた案内は未確定です。</div></div>`;
    const topic=(n,name,count)=>`<div class="topic">${icon(n)}${name}<small>${count}件　›</small></div>`;
    const personC=`${status}${personbar}${personheadFull}${tabs}<div class="personbody"><div class="card book-card"><div class="cover"><b>太郎さんの<br>人生の物語</b></div><div><strong>太郎さんの人生の物語<br>（Webブック）</strong><small>完成した作品</small><button class="read">読む</button></div></div><div class="topic-heading">テーマ別の語り</div>${topic('people','子どもの頃',7)}${topic('brief','仕事と挑戦',5)}${topic('people','家族への想い',6)}${topic('book','人生の知恵',4)}<button class="outline">＋ 新しい語りを追加する</button></div>`;
    const view=new URLSearchParams(location.search).get('view')==='person'?'person':'home';
    document.getElementById('homeLink').classList.toggle('active',view==='home');document.getElementById('personLink').classList.toggle('active',view==='person');
    const panels=view==='home'?[['承認済み Ver1.0','作品がある家族の状態','reference','承認済み画像。Cとの比較基準。'],['A　初回登録直後','家族未登録','homeA','BOOK・人物・思い出は表示しない。'],['B　家族登録済み','BOOK未制作','homeB','人物を表示。BOOKや記録は未作成。'],['C　記録が蓄積','BOOK完成済み','homeC','承認済みの写真・表紙の密度に近づける。']]:[['承認済み Ver1.0','完成した人物の状態','reference','承認済み画像。Cとの比較基準。'],['A　人物登録済み','人生の記録なし','personA','記録とBOOKの空状態を明示。'],['B　人生の記録あり','BOOK未完成','personB','語り2件。完成BOOKは表示しない。'],['C　BOOK完成済み','人生の記録あり','personC','完成BOOKとテーマ別語りを表示。']];
    const content={homeA,homeB,homeC,personA,personB,personC};
    document.getElementById('grid').innerHTML=panels.map(([title,sub,key,note])=>`<section><div class="panelhead"><strong>${title}</strong><small>${sub}</small></div><div class="phone ${key==='reference'?'approved '+view:''}">${key==='reference'?'<img src="../../docs/product/design-references/family-power-v1.0-approved-10-screens.png" alt="承認済みVer1.0の該当画面">':`<div class="mock">${content[key]}</div>`}</div><p class="desc">${note}</p></section>`).join('');
  </script>
</body>
</html>
