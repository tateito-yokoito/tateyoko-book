project_id = "tateyoko-book"

[auth]
site_url = "https://www.tateito-yokoito.jp"
additional_redirect_urls = [
  "https://tateyoko-book.vercel.app/**",
  "https://www.tateito-yokoito.jp/**",
  "https://tateito-yokoito.jp/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"

[storage.vector]
enabled = false

[functions.stripe-webhook]
verify_jwt = false

[functions.super-task]
verify_jwt = false

# The handler validates the signed-in user before using its service role.
[functions.line-connection]
verify_jwt = false

# LINE sends a signed webhook without a Supabase JWT; the handler verifies
# the raw-body X-Line-Signature before changing friendship state.
[functions.line-webhook]
verify_jwt = false

[functions.twilio-status-webhook]
verify_jwt = false

[functions.public-voice]
verify_jwt = false

# Both payment functions validate the bearer token again with auth.getUser.
# Let that validation be the single source of truth so valid sessions are not
# rejected by the Edge gateway before the function can return a useful error.
[functions.create-checkout-session]
verify_jwt = false

[functions.sync-checkout-session]
verify_jwt = false

# Phase 2 handlers verify the signed-in user with auth.getUser, or in the
# consultation intake's case accept anonymous submissions with server-side
# consent, validation, and rate limits. Keep preflight requests reachable.
[functions.create-commerce-v2-checkout]
verify_jwt = false

[functions.create-commerce-v2-additional-checkout]
verify_jwt = false

[functions.submit-commerce-v2-consultation]
verify_jwt = false

[functions.get-commerce-v2-consultation]
verify_jwt = false

[functions.admin-commerce-v2-consultations]
verify_jwt = false

[functions.commerce-v2-staff-production]
verify_jwt = false

[functions.queue-commerce-v2-book-production]
verify_jwt = false

# 回答する家族はアカウントを持たないため、十分に長い依頼IDを使い、
# 関数内で公開範囲を最小限に検証する。
[functions.theme-memory-request-response]
verify_jwt = false
