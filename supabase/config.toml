project_id = "tateyoko-book"

[auth]
site_url = "https://www.tateito-yokoito.jp"
additional_redirect_urls = [
  "https://tateyoko-book.vercel.app/**",
  "https://www.tateito-yokoito.jp/**",
  "https://tateito-yokoito.jp/**",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"

[storage.vector]
enabled = false

[functions.stripe-webhook]
verify_jwt = false

[functions.super-task]
verify_jwt = false

[functions.twilio-status-webhook]
verify_jwt = false

[functions.public-voice]
verify_jwt = false

# Both payment functions validate the bearer token again with auth.getUser.
# Let that validation be the single source of truth so valid sessions are not
# rejected by the Edge gateway before the function can return a useful error.
[functions.create-checkout-session]
verify_jwt = false

[functions.sync-checkout-session]
verify_jwt = false
