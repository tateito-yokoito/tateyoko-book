  <div class="preview-tools"><label for="nenrin-scenario">確認する状態</label><select id="nenrin-scenario" aria-label="確認する状態"><option value="initial">質問を開いた直後</option><option value="one-photo">写真を1枚追加</option><option value="three-photos">写真3枚・横スクロール</option><option value="voice-ready">写真を見ながら録音開始前</option><option value="recording">写真を見ながら録音中</option><option value="polished">録音後の文章確認</option><option value="writing">文章を直接入力</option><option value="resume">写真だけ保存し、後日再開</option><option value="saving">保存中</option><option value="failed">保存失敗</option><option value="finished">写真だけで問いを終えた後</option></select></div>
  <div class="stage"><div class="phone" aria-label="質問回答画面の操作可能なスマートフォンプレビュー"><div class="statusbar"><span>9:41</span><span>●●●  ▰</span></div><div class="appbar"><button type="button" data-action="back">← 戻る</button><span class="brand">縦糸∞横糸</span><span class="count">1 / 26</span></div><div class="scroll" id="nenrin-screen"></div><div class="foot" id="nenrin-foot"></div><div class="confirm-overlay" id="nenrin-confirm" hidden></div></div></div>
  <script>
  (()=>{
    const root=document.getElementById('nenrin-answer-refined');
    const screen=root.querySelector('#nenrin-screen'),foot=root.querySelector('#nenrin-foot'),scenario=root.querySelector('#nenrin-scenario'),confirmBox=root.querySelector('#nenrin-confirm');
    const s={mode:'overview',title:'',titleEditing:false,photos:0,photoNames:[],text:'',audio:false,recording:false,paused:false,countdown:0,save:'untouched',completed:false,style:'語り調',voiceEdits:{},voiceEditing:false,voiceDraft:'',voicePolishCandidate:'',confirmAction:'',playing:false,resumed:false,showStyles:false,candidate:'',photoStep:'',photoDetail:-1,perspective:false,rotation:0};
    const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const voiceBase=style=>style==='そのまま'?'子どものころ、祖母の家の縁側で夏の空を見ていました。':style==='作品調'?'祖母の家の縁側から見上げた夏の空は、今も心に残っています。':'子どものころ、祖母の家の縁側から見た夏の空を覚えています。';
    const previewPolish=(draft,style)=>{const clean=draft.trim().replace(/[ \t]+/g,' ');if(clean===voiceBase(style))return style==='語り調'?'子どものころ、祖母の家の縁側から眺めた夏の空を、今も覚えています。':style==='作品調'?'祖母の家の縁側から見上げた夏の空。その光景は、今も心に残っています。':clean;return clean.replace(/、\s+/g,'、').replace(/。\s+/g,'。\n')};
    function setScenario(value){clearTimeout(root._countdownTimer);clearTimeout(root._transcribeTimer);clearTimeout(root._titleTimer);Object.assign(s,{mode:'overview',title:'',titleEditing:false,photos:0,photoNames:[],text:'',audio:false,recording:false,paused:false,countdown:0,save:'untouched',completed:false,style:'語り調',voiceEdits:{},voiceEditing:false,voiceDraft:'',voicePolishCandidate:'',confirmAction:'',playing:false,resumed:false,showStyles:false,candidate:'',photoStep:'',photoDetail:-1,perspective:false,rotation:0});
      if(value==='one-photo'||value==='resume')s.photos=1;
      if(value==='resume')s.resumed=true;
      if(value==='three-photos')s.photos=3;
      if(value==='voice-ready'){s.photos=1;s.mode='voice'}
      if(value==='recording'){s.photos=1;s.mode='voice';s.recording=true}
      if(value==='polished'){s.photos=1;s.audio=true;s.text='子どものころ、祖母の家の縁側から見た夏の空を覚えています。';s.mode='voice-review'}
      if(value==='writing'){s.mode='write';s.text='子どものころ、祖母の家で過ごした夏が好きでした。'}
      if(value==='saving'){s.photos=1;s.save='saving'}
      if(value==='failed'){s.photos=1;s.save='failed'}
      if(value==='finished'){s.photos=1;s.completed=true}
      s.photoNames=['家族からの手紙','夏の庭','あの日の空'].slice(0,s.photos);
      if(s.photos||s.text||s.audio)s.save=value==='saving'?'saving':value==='failed'?'failed':'saved';
      render();
    }
    function photos(){return s.photos?`<div class="thumbs" aria-label="添えた写真 ${s.photos}枚">${s.photoNames.map((name,i)=>`<button type="button" class="thumb" data-action="zoom" data-index="${i}" aria-label="写真${i+1}を拡大">${escapeHtml(name)}</button>`).join('')}</div>`:''}
    function saveStatus(){if(s.save==='untouched'||s.save==='saved')return '';return `<div class="save-state ${s.save==='failed'?'error':''}" aria-live="polite">${s.save==='saving'?'◌ 保存中…':s.save==='failed'?'！保存できませんでした':''}${s.save==='failed'?'<button type="button" class="inline-button" data-action="retry">再試行</button>':''}</div>`}
    function inputChoices(){return `<div class="choices"><button type="button" data-action="voice"><i data-lucide="mic" aria-hidden="true"></i>声で語る</button><button type="button" data-action="write"><i data-lucide="pen-line" aria-hidden="true"></i>書き込む</button><button type="button" class="photo" data-action="photo"><i data-lucide="image-plus" aria-hidden="true"></i>写真を添える</button></div>`}
    function summary(){if(!(s.photos||s.audio||s.text.trim()))return '';return `<div class="summary"><div class="summary-label">残した内容</div>${photos()}${s.audio?`<button type="button" class="voice-play" data-action="play">${s.playing?'Ⅱ 一時停止':'▶ 録音を再生'}　00:18</button>`:''}${s.text.trim()?`<p class="summary-text">${escapeHtml(s.text)}</p>`:''}</div>`}
    function focus(){
      if(s.mode==='voice')return `<div class="voice-stage"><div class="voice-photo-slot">${photos()}</div><div class="countdown-layer" aria-live="assertive">${s.countdown||''}</div><div class="recorder"><div class="recorder-indicator" aria-live="polite"><div class="recording-status ${s.recording?'': 'waiting'} ${s.paused?'paused':''}"><span class="record-dot" aria-hidden="true"></span>${s.recording?(s.paused?'一時停止中':'録音中'):'録音待機中'}<span class="time">${s.recording?'00:12':'00:00'}</span></div></div><div class="recorder-controls"><div class="recording-actions"><button type="button" data-action="pause-record" ${!s.recording?'disabled':''}>${s.paused?'▶ 再開':'Ⅱ 一時停止'}</button><button type="button" data-action="${s.recording?'stop-record':'record'}" ${s.countdown?'disabled':''}>${s.recording?'■ 録音を終える':'🎙 録音スタート'}</button></div></div></div></div>`;
      if(s.mode==='transcribing')return `<div class="transcribing" role="status">声を、言葉にしています…</div>`;
      if(s.mode==='voice-review')return `<div class="voice-result"><p class="result-status">✓ 録音しました　00:18</p><button type="button" class="voice-play" data-action="play">${s.playing?'Ⅱ 再生を止める':'▶ 声を聞く'}</button><p class="field-label">文章の仕上がりを選ぶ</p><div class="polish">${['そのまま','語り調','作品調'].map(v=>`<button type="button" data-action="style" data-value="${v}" class="${s.style===v?'selected':''}" ${s.voiceEditing?'disabled':''}>${v}</button>`).join('')}</div>${s.voiceEditing?`<textarea class="voice-edit-area" aria-label="文章を編集" data-text="voice-draft">${escapeHtml(s.voiceDraft)}</textarea><div class="review-edit-actions"><button type="button" data-action="polish-voice">✦ 整える</button><button type="button" data-action="ask-save">保存する</button></div><button type="button" class="review-restore" data-action="ask-restore">元の文章に戻す</button>`:`<button type="button" class="text-preview" data-action="edit-voice" aria-label="文章の全文を開いて編集">${escapeHtml(s.text||'文字起こしした文章を表示します')}</button><div class="review-links"><button type="button" data-action="rerecord">録り直す</button><button type="button" data-action="edit-voice">🖊️ 編集する</button></div>`}</div>`;
      if(s.mode==='write')return `${s.photos?`<p class="focus-photo-note">写真を見ながら書けます。</p>${photos()}`:''}${s.candidate?`<p class="field-label">整えた文章を確認</p><div class="candidate">${escapeHtml(s.candidate)}</div><button type="button" class="inline-button" data-action="show-original">元の文章を確認する</button><div class="candidate-actions"><button type="button" data-action="use-candidate">この文章を使う</button><button type="button" data-action="discard-candidate">元の文章に戻す</button></div><p class="focus-photo-note">候補を選ぶまで、元の文章は残ります。</p>`:`<label class="field-label" for="nenrin-writing">回答の文章</label><textarea id="nenrin-writing" data-text="write" placeholder="ここに思い出を書く">${escapeHtml(s.text)}</textarea><div class="write-tools"><button type="button" data-action="toggle-styles" ${!s.text.trim()?'disabled':''}>✦ 整える</button><button type="button" data-action="overview">回答を確認する</button></div>${s.showStyles?`<div class="polish">${['そのまま','語り調','作品調'].map(v=>`<button type="button" data-action="write-style" data-value="${v}">${v}</button>`).join('')}</div>`:''}<p class="focus-photo-note">文章の下書きは自動保存されます。</p>`}`;
      if(s.mode==='photo')return `<div class="focus-top"><h3>写真を添える</h3></div><p class="focus-photo-note">写真1枚からでも残せます。後で言葉や声を加えられます。</p>${photos()}<div class="photo-actions"><button type="button" data-action="start-photo">カメラで撮る</button><button type="button" data-action="start-photo">写真から選ぶ</button></div><p class="focus-photo-note" style="margin-top:14px">写真の切り抜き・台形補正・明るさ調整は、既存の写真画面を使います。</p>`;return '';
    }
    function photoProcess(){if(!s.photoStep)return '';if(s.photoStep==='crop')return `<div class="focus-top"><h3>写真の切り抜き</h3><button type="button" data-action="cancel-photo">戻る</button></div><p class="focus-photo-note">既存の写真補正画面に進みます。</p><div class="photo-process"><div class="crop-area">選んだ写真</div><div class="process-actions"><button type="button" data-action="rotate-photo">右に回転</button><button type="button" data-action="perspective-photo">台形補正 ${s.perspective?'オン':'オフ'}</button><button type="button" class="dark" data-action="crop-next">切り抜きを完了</button></div></div>`;return `<div class="focus-top"><h3>写真を整える</h3><button type="button" data-action="crop-back">切り抜きに戻る</button></div><div class="photo-process"><div class="crop-area">補正後の写真</div><label>明るさ <input type="range" min="0" max="100" value="55" aria-label="明るさ"></label><label>コントラスト <input type="range" min="0" max="100" value="50" aria-label="コントラスト"></label><div class="process-actions"><button type="button" class="dark" data-action="confirm-photo">この写真を使う</button></div></div>`}
    function photoDetail(){return `<div class="focus-top"><h3>写真を確認</h3><button type="button" data-action="close-photo-detail">閉じる</button></div><div class="photo-detail"><div class="large-photo">${escapeHtml(s.photoNames[s.photoDetail]||'写真')}</div><div class="detail-actions"><button type="button" data-action="swap-photo" ${s.photos<2?'disabled':''}>順番を変える</button><button type="button" data-action="remove-photo">この写真を外す</button></div></div>`}
    function render(){let content='<p class="theme">'+escapeHtml(window.nenrinSeasonalBridge?.context?.theme||'幼い頃のこと')+'</p>';
      if(s.completed){content+='<div class="end-state"><h2>この問いを終えました</h2><p>保存した写真は、次に開いたときも残っています。</p></div>';}
      else if(s.photoStep||s.photoDetail>=0){content+=s.photoStep?photoProcess():photoDetail()}
      else {const freeTitle=window.nenrinSeasonalBridge?.context?.kind==='day';content+=`<div class="${freeTitle?'free-title':''}"><h2>${escapeHtml(freeTitle?(s.title||'今、残しておきたいこと'):(window.nenrinSeasonalBridge?.context?.question||'幼い頃、どんなところに住んでいましたか？'))}</h2>${freeTitle&&s.mode==='overview'?(s.titleEditing?`<div class="title-edit"><input type="text" data-title maxlength="80" aria-label="記録のタイトル（任意）" placeholder="タイトルをつける（任意）" value="${escapeHtml(s.title)}"><button type="button" data-action="close-title">閉じる</button></div>`:`<button type="button" class="title-toggle" data-action="edit-title">${s.title?'タイトルを変更する':'タイトルをつける（任意）'}</button>`):''}</div>`;
        if(s.mode==='overview')content+=`${s.resumed?'<p class="intro">前に残した写真から、続きを始められます。</p>':''}${s.photos||s.audio||s.text.trim()?summary():'<p class="intro">思い出せるところから、少しずつ。</p>'}${saveStatus()}${inputChoices()}`;
        else content+=['voice','voice-review','transcribing'].includes(s.mode)?`${focus()}${saveStatus()}`:`${saveStatus()}${focus()}`;
      }
      screen.innerHTML=content;
      foot.classList.toggle('hidden',s.mode==='write'||s.voiceEditing||s.mode==='transcribing'||!!s.photoStep||s.photoDetail>=0);
      if(s.completed)foot.innerHTML='<button type="button" data-action="next">次の問いへ</button>';
      else if(s.mode==='overview')foot.innerHTML=`<button type="button" data-action="complete" ${!(s.photos||s.audio||s.text.trim())||s.save!=='saved'?'disabled':''}>この問いを終える</button>${s.save==='failed'?'<small>保存できるまで完了できません</small>':''}`;
      else if(s.mode==='photo')foot.innerHTML='<button type="button" data-action="overview">回答を確認する</button>';
      else if(['voice','voice-review'].includes(s.mode))foot.innerHTML=`<button type="button" data-action="overview" ${s.recording||s.countdown||s.save!=='saved'||!(s.photos||s.audio||s.text.trim())?'disabled':''}>回答を確認する</button>`;
      else foot.innerHTML='';
      confirmBox.hidden=!s.confirmAction;
      confirmBox.innerHTML=s.confirmAction?`<div class="confirm-card" role="dialog" aria-modal="true" aria-label="編集の確認"><p>${s.confirmAction==='restore'?`編集を取り消して、元の${s.style}の文章に戻しますか？`:s.confirmAction==='polish'?`「${s.style}」で整えた文章を採用しますか？`:'編集結果を上書き保存してよろしいですか？'}</p>${s.confirmAction==='polish'?`<div class="polish-candidate">${escapeHtml(s.voicePolishCandidate)}</div>`:''}<div class="confirm-actions"><button type="button" data-action="cancel-confirm">${s.confirmAction==='polish'?'採用せず戻る':'戻る'}</button><button type="button" data-action="accept-confirm">${s.confirmAction==='restore'?'元に戻す':s.confirmAction==='polish'?'この文章を採用':'保存する'}</button></div></div>`:'';
      if(globalThis.lucide?.createIcons)globalThis.lucide.createIcons({attrs:{width:18,height:18}});
    }
    root.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;
      if(a==='voice'||a==='write'||a==='photo'){s.mode=a;screen.scrollTop=0}
      if(a==='edit-title')s.titleEditing=true;
      if(a==='close-title')s.titleEditing=false;
      if(a==='overview'||a==='back'){clearTimeout(root._countdownTimer);clearTimeout(root._transcribeTimer);s.countdown=0;s.recording=false;s.paused=false;s.mode='overview';screen.scrollTop=0}
      if(a==='start-photo'){s.photoStep='crop';s.photoDetail=-1;s.mode='photo'}
      if(a==='cancel-photo')s.photoStep='';
      if(a==='rotate-photo')s.rotation=(s.rotation+90)%360;
      if(a==='perspective-photo')s.perspective=!s.perspective;
      if(a==='crop-next')s.photoStep='adjust';
      if(a==='crop-back')s.photoStep='crop';
      if(a==='confirm-photo'){s.photoStep='';s.photoNames.push(`新しい写真 ${s.photoNames.length+1}`);s.photos=s.photoNames.length;s.save='saved'}
      if(a==='remove-photo'){s.photoNames.splice(s.photoDetail,1);s.photos=s.photoNames.length;s.photoDetail=-1;s.save=s.photos||s.audio||s.text.trim()?'saved':'untouched'}
      if(a==='swap-photo'&&s.photos>1){const target=(s.photoDetail+1)%s.photos;[s.photoNames[s.photoDetail],s.photoNames[target]]=[s.photoNames[target],s.photoNames[s.photoDetail]];s.photoDetail=-1}
      if(a==='close-photo-detail')s.photoDetail=-1;
      if(a==='record'){s.countdown=3;s.paused=false;const tick=()=>{if(!s.countdown)return;s.countdown-=1;if(s.countdown===0)s.recording=true;render();if(s.countdown)root._countdownTimer=setTimeout(tick,1000)};root._countdownTimer=setTimeout(tick,1000)}
      if(a==='pause-record')s.paused=!s.paused;
      if(a==='stop-record'){s.recording=false;s.paused=false;s.mode='transcribing';s.save='saving';root._transcribeTimer=setTimeout(()=>{s.audio=true;s.text=s.text||'子どものころ、祖母の家の縁側から見た夏の空を覚えています。';s.save='saved';s.mode='voice-review';render()},1100)}
      if(a==='style'&&!s.voiceEditing){s.style=b.dataset.value;s.text=s.voiceEdits[s.style]??voiceBase(s.style)}
      if(a==='rerecord'){s.mode='voice';s.recording=false;s.paused=false;s.countdown=0}
      if(a==='edit-voice'){s.voiceEditing=true;s.voiceDraft=s.text}
      if(a==='ask-save')s.confirmAction='save';
      if(a==='ask-restore')s.confirmAction='restore';
      if(a==='polish-voice'&&s.voiceDraft.trim()){s.voicePolishCandidate=previewPolish(s.voiceDraft,s.style);s.confirmAction='polish'}
      if(a==='cancel-confirm')s.confirmAction='';
      if(a==='accept-confirm'){
        if(s.confirmAction==='save'){s.voiceEdits[s.style]=s.voiceDraft;s.text=s.voiceDraft;s.save='saved'}
        if(s.confirmAction==='restore'){delete s.voiceEdits[s.style];s.text=voiceBase(s.style)}
        if(s.confirmAction==='polish'){s.voiceDraft=s.voicePolishCandidate;s.voicePolishCandidate=''}
        else s.voiceEditing=false;
        s.confirmAction='';
      }
      if(a==='toggle-styles')s.showStyles=!s.showStyles;
      if(a==='write-style'){s.showStyles=false;if(b.dataset.value!=='そのまま')s.candidate=b.dataset.value==='語り調'?'子どものころ、祖母の家で過ごした夏が好きでした。縁側から眺めた空を、今でもよく覚えています。':'祖母の家で過ごした夏の日々は、今も私の心に残っています。';}
      if(a==='use-candidate'){s.text=s.candidate;s.candidate='';s.save='saved'}
      if(a==='discard-candidate')s.candidate='';
      if(a==='show-original'){b.textContent=s.text;b.removeAttribute('data-action');return}
      if(a==='play')s.playing=!s.playing;
      if(a==='retry')s.save='saved';
      if(a==='zoom')s.photoDetail=Number(b.dataset.index||0);
      if(a==='complete'&&s.save==='saved'&&(s.photos||s.audio||s.text.trim())){root.dispatchEvent(new CustomEvent('seasonal-answer-complete'));s.completed=true;scenario.value='finished'}
      if(a==='next'){setScenario('initial');scenario.value='initial';return}
      render();
    });
    root.addEventListener('input',e=>{if(e.target.matches('[data-title]')){s.title=e.target.value;s.save='saving';clearTimeout(root._titleTimer);root._titleTimer=setTimeout(()=>{s.save='saved';if(!s.titleEditing)render()},650);return}if(e.target.matches('[data-text="voice-draft"]')){s.voiceDraft=e.target.value;return}if(e.target.matches('[data-text]')){s.text=e.target.value;s.save='saving';let state=screen.querySelector('.save-state');if(!state){state=document.createElement('div');state.className='save-state';state.setAttribute('aria-live','polite');screen.insertBefore(state,screen.querySelector('.focus-top')||screen.querySelector('.field-label')||screen.firstChild)}state.textContent='◌ 保存中…';clearTimeout(root._saveTimer);root._saveTimer=setTimeout(()=>{s.save='saved';const currentState=screen.querySelector('.save-state');if(currentState)currentState.remove();if(s.mode==='overview')render()},650)}});
    root.addEventListener('focusin',e=>{if(e.target.matches('textarea'))foot.classList.add('hidden')});
    root.addEventListener('focusout',e=>{if(e.target.matches('textarea')&&!s.recording&&s.mode!=='write')foot.classList.remove('hidden')});
    window.nenrinSeasonalBridge={context:null,seed(data){setScenario('initial');Object.assign(s,{mode:'overview',title:data.title||'',photos:data.photos||0,photoNames:data.photoNames||[],text:data.text||'',audio:!!data.audio,save:data.save||'untouched',resumed:!!data.resumed});render()},fail(){s.save='failed';render()},snapshot(){return {title:s.title,photos:s.photos,photoNames:[...s.photoNames],text:s.text,audio:s.audio,save:s.save,mode:s.mode}}};scenario.addEventListener('change',()=>setScenario(scenario.value));
    setScenario('initial');
  })();
  </script>
</div>
</body></html>
